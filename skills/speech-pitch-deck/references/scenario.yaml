schema_version: "0.2"
scenario:
  id: speech-pitch-deck
  name: Speech and Pitch Deck
  version: "0.5.0"
communication_job:
  primary: Move a live audience toward a memorable belief, follow-up, approval, adoption, or investment action.
  success_condition: The audience can state the core idea, recall the strongest proof, and understand the next action after the speaker finishes.
audience:
  - conference-audience
  - investors
  - customers
  - executive-stakeholders
decision_types:
  - believe
  - support
  - meet
  - adopt
  - invest
storyline_patterns:
  - one-idea-tension-resolution-action
  - problem-insight-proof-future-ask
  - proposition-why-now-proof-ask
evidence_standard:
  level: high
  claim_policy: Distinguish story, observation, verified fact, estimate, demonstration, testimonial, and aspiration; fact-check every material claim.
  source_policy: Preserve sources for factual claims and permissions for testimonials or media; identify missing proof rather than inventing it.
density:
  default: low
  range:
    - low
    - medium
preferred_grammar:
  - assertion
  - evidence
  - trend
  - comparison
  - narrative
  - quote
  - image-led
  - decision
required_archetypes:
  - opening-hook
  - core-idea
  - problem-stakes
  - insight
  - proof
  - demonstration
  - future-state
  - explicit-ask
  - closing-callback
theme_recommendations:
  default: slope-trace
  alternatives: [silent-spectrum, night-relay]
  selection_note: Use Slope Trace for an authored progression from goal to action; use Silent Spectrum when the talk needs sparse stage peaks plus a legible proof ledger; use Night Relay when a live venue needs dark mechanism peaks and a memorable Agent-to-learner responsibility handoff.
component_recipes:
  opening-hook: {archetype: cover, layout_variant: cover-offset, purpose: "Open with tension, surprise, or a concrete human moment", required_roles: [deck-title, opening-tension]}
  core-idea: {archetype: statement, layout_variant: statement-left, purpose: State the one memorable proposition, required_roles: [core-idea, qualifier]}
  problem-stakes: {archetype: comparison, layout_variant: split-comparison, purpose: Make the current cost and desired shift visible, required_roles: [current-state, stakes, desired-state]}
  insight: {archetype: statement, layout_variant: statement-bracketed, purpose: Reframe the problem with one defensible insight, required_roles: [insight, proof-cue]}
  proof: {archetype: data, layout_variant: metric-and-context, purpose: Pair one hero proof point with its meaning, required_roles: [primary-metric, evidence-context, source-note]}
  demonstration: {archetype: image, layout_variant: annotated-artifact, purpose: "Show the product, behavior, or mechanism in action", required_roles: [demonstration, annotation]}
  future-state: {archetype: image, layout_variant: image-full-bleed, purpose: Make the credible future tangible, required_roles: [future-visual, future-assertion]}
  explicit-ask: {archetype: closing, layout_variant: closing-decision, purpose: Name the next action and why now, required_roles: [decision-statement, next-action, deadline]}
  closing-callback: {archetype: closing, layout_variant: closing-commitment, purpose: Return to the opening idea and leave one line to remember, required_roles: [callback, commitment]}
anti_patterns:
  - biography-first
  - agenda-first
  - slide-as-script
  - unsupported-superlative
  - buried-ask
  - dense-explainer
default_permission_profile: content-style
