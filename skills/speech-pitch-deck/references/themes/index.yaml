schema_version: "0.1"
selection_policy:
  order: scenario-first-then-theme
  preview_count: 3
  preview_sequence: [cover, core-component, closing]
  disclosure: Read this index first, inspect only shortlisted preview.md files, then load only the selected theme.yaml and theme.css.
themes:
  - id: learning-agent
    name: Learning Agent
    name_zh: 学习智能体
    tagline: 让真实学习现场与可验收的 Agent 委托交替出现
    mood: [editorial, human, assured]
    tone: [facilitative, contemporary, credible]
    formality: medium
    density: medium
    best_for: [corporate-training-workshop, agent-literacy-workshop]
    avoid_for: [technical-reference-manual, passive-announcement]
    preview: learning-agent/preview.md
    theme: learning-agent/theme.yaml
  - id: signal-grid
    name: Signal Grid
    name_zh: 信号网格
    tagline: 把证据、取舍与行动压缩成清晰信号
    mood: [decisive, editorial, progressive]
    tone: [executive, product, evidence-led, authored]
    formality: high
    density: medium-high
    best_for: [product-roadmap-review, industry-research-deck]
    avoid_for: [ceremonial-event]
    preview: signal-grid/preview.md
    theme: signal-grid/theme.yaml
  - id: executive-night
    name: Executive Night
    name_zh: 董事会夜幕
    tagline: 克制、权威、适合关键决策
    mood: [institutional, calm, premium]
    tone: [boardroom, strategic, formal]
    formality: high
    density: medium
    best_for: [product-roadmap-review, industry-research-deck, speech-pitch-deck]
    avoid_for: [playful-training]
    preview: executive-night/preview.md
    theme: executive-night/theme.yaml
  - id: evidence-ledger
    name: Evidence Ledger
    name_zh: 证据账本
    tagline: 让来源、范围与不确定性可追溯
    mood: [rigorous, editorial, documentary]
    tone: [research, analytical, precise]
    formality: high
    density: high
    best_for: [industry-research-deck, product-roadmap-review]
    avoid_for: [minimal-keynote]
    preview: evidence-ledger/preview.md
    theme: evidence-ledger/theme.yaml
  - id: stage-contrast
    name: Stage Contrast
    name_zh: 舞台对比
    tagline: 为现场表达保留记忆点
    mood: [dramatic, focused, cinematic]
    tone: [spoken, persuasive, bold]
    formality: medium
    density: low
    best_for: [speech-pitch-deck, ux-brand-case-study]
    avoid_for: [dense-research-appendix]
    preview: stage-contrast/preview.md
    theme: stage-contrast/theme.yaml
  - id: slope-trace
    name: Slope Trace
    name_zh: 坡迹
    tagline: 把目标到迁移的学习坡度变成跨页推进结构
    mood: [progressive, spacious, authored]
    tone: [conceptual, precise, optimistic]
    formality: medium
    density: medium
    best_for: [speech-pitch-deck, product-vision-talk]
    avoid_for: [compliance-report, dense-research-appendix]
    preview: slope-trace/preview.md
    theme: slope-trace/theme.yaml
  - id: night-relay
    name: Night Relay
    name_zh: 夜间接力
    tagline: 让目标、Agent 与学习者责任在深浅交替的舞台中完成接力
    mood: [dramatic, focused, contemporary]
    tone: [spoken, technological, responsible]
    formality: medium
    density: low
    best_for: [speech-pitch-deck, live-product-talk]
    avoid_for: [print-handout, dense-research-appendix]
    preview: night-relay/preview.md
    theme: night-relay/theme.yaml
  - id: artifact-editorial
    name: Artifact Editorial
    name_zh: 作品集画册
    tagline: 让作品、证据与设计判断共同叙事
    mood: [editorial, tactile, crafted]
    tone: [design-led, reflective, authored]
    formality: medium
    density: medium
    best_for: [ux-brand-case-study, speech-pitch-deck, corporate-training-workshop]
    avoid_for: [financial-control-room]
    preview: artifact-editorial/preview.md
    theme: artifact-editorial/theme.yaml
  - id: material-ledger
    name: Material Ledger
    name_zh: 材质档案
    tagline: 用档案编号、材料感和应用物证建立可追溯的设计判断
    mood: [tactile, editorial, assured]
    tone: [crafted, reflective, evidence-led]
    formality: medium
    density: medium
    best_for: [ux-brand-case-study, brand-system-review, portfolio-interview]
    avoid_for: [financial-control-room, high-energy-keynote]
    preview: material-ledger/preview.md
    theme: material-ledger/theme.yaml
  - id: signal-pitch
    name: Signal Pitch
    name_zh: 信号提案
    tagline: 用无描边色块把挑战、证据、选择与反思转译为高辨识度信号
