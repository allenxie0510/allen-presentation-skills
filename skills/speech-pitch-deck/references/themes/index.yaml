    theme: signal-pitch/theme.yaml
  - id: open-frame
    name: Open Frame
    name_zh: 开放画幅
    tagline: 用纪实大图、建筑感留白和尺度变化呈现设计判断
    mood: [spacious, human, authored]
    tone: [portfolio, reflective, contemporary]
    formality: medium
    density: medium
    best_for: [ux-brand-case-study, portfolio-interview, design-award-review]
    avoid_for: [dense-research-appendix, operational-dashboard]
    preview: open-frame/preview.md
    theme: open-frame/theme.yaml
  - id: learning-canvas
    name: Learning Canvas
    name_zh: 学习画布
    tagline: 用清晰步骤支持练习与迁移
    mood: [friendly, structured, active]
    tone: [instructional, practical, encouraging]
    formality: medium
    density: medium
    best_for: [corporate-training-workshop]
    avoid_for: [investor-roadshow]
    preview: learning-canvas/preview.md
    theme: learning-canvas/theme.yaml
