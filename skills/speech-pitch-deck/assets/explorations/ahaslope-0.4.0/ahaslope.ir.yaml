        style: {token: typography.caption, variant: null, overrides: {font_size: 14}}
        editable: *edit

  - id: s06-future-ask
    archetype: closing
    purpose: Turn the concept into a bounded next action and return to the opening idea.
    grammar: decision
    assertion: {text: 不先找课程；先选择一个必须学会的真实目标, status: provisional}
    narrative_role: {section: future-state-and-ask, sequence: closing}
    layout_variant: closing-decision
    permission_profile: content-style
    speaker_notes: "明确请求：与一位合作方选择一个真实目标，定义比较基线与成功标准，完成一次小规模试点。不要以‘谢谢’结束。"
    objects:
      - <<: *title
        id: s06-ask
        role: decision-statement
        content: {text: "不先找课程。\n先选择一个\n必须学会的真实目标。"}
