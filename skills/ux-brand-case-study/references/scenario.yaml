schema_version: "0.2"
scenario:
  id: ux-brand-case-study
  name: UX and Brand Case Study
  version: "0.4.0"
communication_job:
  primary: Demonstrate design judgment, system thinking, collaboration, and credible impact so an audience can trust, hire, approve, or select the work.
  success_condition: The audience can connect the challenge and evidence to design choices, distinguish individual and team contributions, and judge outcomes with limitations visible.
audience:
  - hiring-managers
  - prospective-clients
  - design-leaders
  - product-executives
decision_types:
  - hire
  - select
  - approve
  - trust
  - invest
storyline_patterns:
  - context-evidence-decision-outcome-reflection
  - challenge-insight-system-application-impact
  - before-diagnosis-iteration-after
evidence_standard:
  level: high
  claim_policy: Distinguish artifact, observation, research finding, design rationale, team contribution, individual contribution, proxy outcome, and measured impact.
  source_policy: Preserve research method, sample, artifact provenance, outcome period, attribution limits, permissions, and confidentiality constraints.
density:
  default: medium
  range:
    - medium
    - medium-high
preferred_grammar:
  - assertion
  - evidence
  - comparison
  - causality
  - process
  - relationship
  - narrative
  - image-led
required_archetypes:
  - case-summary
  - challenge-and-stakes
  - role-and-constraints
  - research-evidence
  - insight-to-decision
  - iteration
  - system-overview
  - application-gallery
  - before-after
  - outcomes
  - reflection
theme_recommendations:
  default: material-ledger
  alternatives: [signal-pitch, open-frame]
  selection_note: Use Material Ledger for traceable UX and brand-system cases, Signal Pitch for fast client or design-lead decisions, and Open Frame for image-led portfolio interviews or award reviews.
component_recipes:
  case-summary: {archetype: cover, layout_variant: cover-offset, purpose: "Establish challenge, role, outcome, and disclosure boundary", required_roles: [deck-title, role-summary, outcome-summary]}
  challenge-and-stakes: {archetype: comparison, layout_variant: split-comparison, purpose: Show the before-state and why it mattered, required_roles: [challenge, stakes, baseline]}
  role-and-constraints: {archetype: two-column, layout_variant: two-column-balanced, purpose: "Separate individual contribution, team work, and constraints", required_roles: [role, collaborators, constraints]}
  research-evidence: {archetype: data, layout_variant: evidence-ledger, purpose: Show only evidence that changed a design decision, required_roles: [research-method, evidence, limitation]}
  insight-to-decision: {archetype: process, layout_variant: causal-chain, purpose: "Connect evidence to insight, principle, and choice", required_roles: [evidence, insight, design-decision]}
  iteration: {archetype: comparison, layout_variant: before-after, purpose: Compare alternatives and explain what was learned, required_roles: [alternative-a, alternative-b, learning]}
  system-overview: {archetype: process, layout_variant: learning-loop, purpose: Explain the design system and its operating logic, required_roles: [system-elements, system-rules, applications]}
  application-gallery: {archetype: image, layout_variant: annotated-artifact, purpose: Show representative applications with consequential annotation, required_roles: [artifact, annotation, principle]}
  before-after: {archetype: comparison, layout_variant: before-after, purpose: Compare behavior or expression using a fair baseline, required_roles: [before-state, after-state, comparison-note]}
  outcomes: {archetype: data, layout_variant: metric-and-context, purpose: Report outcomes with attribution limits, required_roles: [outcome-metric, attribution-note, limitation]}
  reflection: {archetype: closing, layout_variant: closing-commitment, purpose: "State what changed, what remains unresolved, and what was learned", required_roles: [reflection, unresolved-question]}
anti_patterns:
  - beauty-gallery
  - process-theater
  - false-attribution
  - nda-leakage
  - final-mockups-only
  - vanity-metrics
default_permission_profile: content-style
