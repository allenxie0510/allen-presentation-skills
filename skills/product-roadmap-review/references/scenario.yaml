schema_version: "0.2"
scenario:
  id: product-roadmap-review
  name: Product Roadmap Review
  version: "0.4.0"
communication_job:
  primary: Help product leadership choose outcomes, opportunities, priorities, sequencing, and commitments under uncertainty.
  success_condition: The audience can approve, change, stop, or sequence work with the evidence, trade-offs, dependencies, and confidence visible.
audience:
  - product-leadership
  - engineering-leadership
  - design-leadership
  - executive-stakeholders
decision_types:
  - approve
  - prioritize
  - sequence
  - stop
  - escalate
storyline_patterns:
  - outcome-evidence-choice-commitment
  - progress-learning-adjustment
  - opportunity-options-priority
evidence_standard:
  level: high
  claim_policy: Distinguish shipped output, observed product outcome, customer evidence, experiment result, forecast, and assumption.
  source_policy: Preserve source, period, cohort, sample, metric definition, and confidence for material claims; triangulate customer and product evidence where possible.
density:
  default: high
  range:
    - medium-high
    - high
preferred_grammar:
  - assertion
  - evidence
  - trend
  - comparison
  - causality
  - process
  - relationship
  - decision
required_archetypes:
  - decision-summary
  - outcome-scorecard
  - now-next-later-roadmap
  - opportunity-solution-tree
  - tradeoff-matrix
  - dependency-map
  - risk-register
  - decision-required
theme_recommendations:
  default: signal-grid
  alternatives: [silent-spectrum, executive-night]
  selection_note: Use Signal Grid for operating reviews, Silent Spectrum for a complete editorial decision arc with dense dependency pages, and Executive Night for board-level approval.
component_recipes:
  decision-summary: {archetype: closing, layout_variant: closing-decision, purpose: Make the leadership choice explicit, required_roles: [decision-statement, decision-owner]}
  outcome-scorecard: {archetype: data, layout_variant: kpi-scorecard, purpose: Separate outcomes from shipped output, required_roles: [slide-assertion, primary-metric, supporting-metric]}
  now-next-later-roadmap: {archetype: timeline, layout_variant: now-next-later, purpose: Sequence work without false date certainty, required_roles: [slide-assertion, roadmap-phases, confidence-label]}
  opportunity-solution-tree: {archetype: process, layout_variant: causal-chain, purpose: Connect outcomes to evidenced customer opportunities and candidate solutions, required_roles: [target-outcome, opportunity-evidence, solution-options]}
  tradeoff-matrix: {archetype: comparison, layout_variant: tradeoff-matrix, purpose: Compare options using explicit criteria, required_roles: [comparison-axis, options, recommendation]}
  dependency-map: {archetype: process, layout_variant: learning-loop, purpose: Expose cross-team dependencies and decision gates, required_roles: [dependencies, decision-gates]}
  risk-register: {archetype: data, layout_variant: evidence-ledger, purpose: "Show risk, likelihood, impact, owner, and mitigation", required_roles: [risk-items, risk-owner, mitigation]}
  decision-required: {archetype: closing, layout_variant: closing-decision, purpose: "End with decision, owner, next evidence, and review date", required_roles: [decision-statement, decision-owner, next-evidence]}
anti_patterns:
  - feature-list-as-strategy
  - output-as-outcome
  - false-date-certainty
  - priority-without-criteria
  - hidden-dependency
  - backlog-tour
default_permission_profile: content-style
