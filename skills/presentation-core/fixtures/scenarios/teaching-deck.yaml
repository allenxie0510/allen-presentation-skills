schema_version: "0.2"
scenario:
  id: teaching-deck
  name: Teaching Deck
  version: "0.1"
communication_job:
  primary: Move learners from prior knowledge to a usable mental model and observable application.
  success_condition: Learners can explain the concept, apply it to a new case, and identify a common misuse.
audience:
  - adult-learners
  - practitioners
decision_types:
  - explain
  - apply
  - diagnose
storyline_patterns:
  - activate-model-practice-check-transfer
evidence_standard:
  level: moderate
  claim_policy: Use accurate definitions, representative examples, and explicit boundaries for simplified models.
  source_policy: Cite non-trivial claims and distinguish teaching analogies from literal mechanisms.
density:
  default: medium
  range:
    - low
    - medium
preferred_grammar:
  - narrative
  - process
  - comparison
  - causality
  - evidence
required_archetypes:
  - learning-objectives
  - concept-model
  - worked-example
  - misconception-check
  - practice
  - recap
theme_recommendations:
  default: learning-canvas
  alternatives: [signal-grid, artifact-editorial]
  selection_note: Select by learner context and facilitation style.
component_recipes:
  learning-objectives: {archetype: statement, layout_variant: statement-bracketed, purpose: State observable outcomes, required_roles: [observable-outcomes]}
  concept-model: {archetype: process, layout_variant: linear-process, purpose: Explain the mental model, required_roles: [model-stages]}
  worked-example: {archetype: two-column, layout_variant: two-column-emphasis, purpose: Demonstrate application, required_roles: [worked-steps]}
  misconception-check: {archetype: comparison, layout_variant: tradeoff-matrix, purpose: Diagnose common misuse, required_roles: [check-prompt]}
  practice: {archetype: process, layout_variant: learning-loop, purpose: Guide learner practice, required_roles: [instructions]}
  recap: {archetype: closing, layout_variant: closing-commitment, purpose: Transfer learning to work, required_roles: [commitment]}
anti_patterns:
  - definition-wall
  - unexplained-jargon
  - decorative-quiz
  - answer-before-thinking
default_permission_profile: content-only
