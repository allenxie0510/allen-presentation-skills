schema_version: "0.2"
scenario:
  id: board-review
  name: Board Review
  version: "0.1"
communication_job:
  primary: Enable board-level understanding, prioritization, and explicit decisions.
  success_condition: Directors can distinguish performance signals, causes, risks, and decisions requiring action.
audience:
  - board
  - executives
decision_types:
  - approve
  - prioritize
  - escalate
storyline_patterns:
  - performance-to-explanation-to-action
evidence_standard:
  level: high
  claim_policy: Every material assertion is tied to a defined metric, comparison, or documented operating fact.
  source_policy: Record the reporting period, metric definition, and source for every board-relevant number.
density:
  default: high
  range:
    - medium-high
    - high
preferred_grammar:
  - assertion
  - trend
  - comparison
  - causality
  - decision
required_archetypes:
  - executive-summary
  - kpi-scorecard
  - variance-analysis
  - risk
  - decision-required
theme_recommendations:
  default: executive-night
  alternatives: [signal-grid, evidence-ledger]
  selection_note: Select by meeting formality and evidence density.
component_recipes:
  executive-summary: {archetype: statement, layout_variant: statement-left, purpose: Summarize the operating judgment, required_roles: [slide-assertion]}
  kpi-scorecard: {archetype: data, layout_variant: kpi-scorecard, purpose: Show board-level signals, required_roles: [primary-metric]}
  variance-analysis: {archetype: chart, layout_variant: variance-bars, purpose: Explain material variance, required_roles: [variance-chart]}
  risk: {archetype: data, layout_variant: evidence-ledger, purpose: Surface material risk, required_roles: [risk-items]}
  decision-required: {archetype: closing, layout_variant: closing-decision, purpose: Name the required board decision, required_roles: [decision-statement]}
anti_patterns:
  - decorative-data
  - vague-headlines
  - unexplained-metrics
  - hidden-decision
default_permission_profile: content-only
