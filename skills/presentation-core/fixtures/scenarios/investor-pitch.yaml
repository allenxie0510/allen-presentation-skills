schema_version: "0.2"
scenario:
  id: investor-pitch
  name: Investor Pitch
  version: "0.1"
communication_job:
  primary: Build sufficient conviction and curiosity to earn the next investment decision step.
  success_condition: Investors understand the problem, differentiated insight, evidence of pull, business potential, and explicit ask.
audience:
  - early-stage-investors
  - investment-partners
decision_types:
  - continue-diligence
  - schedule-partner-meeting
  - decline
storyline_patterns:
  - problem-insight-proof-opportunity-ask
evidence_standard:
  level: high
  claim_policy: Separate verified traction from hypotheses and label missing evidence rather than inventing metrics.
  source_policy: Trace traction, market, and customer claims to user-provided or cited sources.
density:
  default: medium
  range:
    - low
    - medium
preferred_grammar:
  - narrative
  - assertion
  - evidence
  - comparison
  - trend
required_archetypes:
  - cover
  - problem
  - insight
  - solution
  - traction
  - market
  - ask
theme_recommendations:
  default: stage-contrast
  alternatives: [executive-night, artifact-editorial]
  selection_note: Select by venue, proof density, and spoken-delivery mode.
component_recipes:
  cover: {archetype: cover, layout_variant: cover-offset, purpose: Open with the proposition, required_roles: [deck-title]}
  problem: {archetype: comparison, layout_variant: split-comparison, purpose: Make the customer problem concrete, required_roles: [problem, stakes]}
  insight: {archetype: statement, layout_variant: statement-left, purpose: State the differentiated insight, required_roles: [core-idea]}
  solution: {archetype: image, layout_variant: annotated-artifact, purpose: Demonstrate the solution, required_roles: [demonstration]}
  traction: {archetype: data, layout_variant: metric-and-context, purpose: Show verified pull, required_roles: [primary-metric]}
  market: {archetype: chart, layout_variant: range-bars, purpose: Bound the opportunity honestly, required_roles: [range-chart]}
  ask: {archetype: closing, layout_variant: closing-decision, purpose: Name the next investment step, required_roles: [decision-statement]}
anti_patterns:
  - feature-dump
  - unsupported-market-size
  - generic-disruption-claim
  - crowded-roadmap
default_permission_profile: content-style
