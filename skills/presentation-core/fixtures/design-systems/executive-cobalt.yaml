schema_version: "0.3"
meta:
  id: executive-cobalt
  name: Executive Cobalt
  version: "0.1"
  status: draft
  provenance: ai-derived-candidate
  reviewed_by: null
  reviewed_at: null
intent:
  tone:
    - precise
    - editorial
    - contemporary
  formality: high
  energy: medium
  density: medium-high
best_for:
  - board-review
  - consulting-deck
  - research-report
avoid_for:
  - children-education
  - playful-event
visual_dna:
  composition:
    symmetry: asymmetric
    whitespace: generous
    hierarchy: sharp
    rhythm: editorial
  grid:
    columns: 12
    gutter: 24
    margin_left: 120
    margin_right: 120
    margin_top: 84
    margin_bottom: 72
  color_behavior:
    strategy: dominant-neutral-single-accent
    approximate_ratio:
      background: 0.72
      neutral: 0.23
      accent: 0.05
  spacing_rhythm:
    base_unit: 12
    steps:
      - 12
      - 24
      - 36
      - 48
      - 72
      - 96
  image_behavior:
    crop: editorial
    treatment: natural
    corner_radius: 0
colors:
  canvas: "#F6F2E8"
  surface: "#FFFFFF"
  text_primary: "#111111"
  text_secondary: "#66625C"
  accent_primary: "#1E43D8"
  positive: "#16875A"
  negative: "#C84444"
  rule: "rgba(17,17,17,.16)"
typography:
  hero:
    family_class: swiss-grotesk
    preferred_family: null
    fallback:
      - Helvetica Neue
      - Arial
      - sans-serif
    weight: 700
    size: 112
    line_height: 0.96
    tracking: -0.035
    max_line_length: 24
    behavior:
      - short-lines
      - aggressive-scale
  slide_title:
    family_class: swiss-grotesk
    preferred_family: null
    fallback:
      - Helvetica Neue
      - Arial
      - sans-serif
    weight: 700
    size: 54
    line_height: 1.05
    tracking: -0.025
    max_line_length: 42
    behavior:
      - assertion-led
      - one-or-two-lines
  body:
    family_class: neo-grotesk
    preferred_family: null
    fallback:
      - Helvetica Neue
      - Arial
      - sans-serif
    weight: 400
    size: 28
    line_height: 1.48
    tracking: 0
    max_line_length: 58
    behavior:
      - compact-paragraphs
  caption:
    family_class: neo-grotesk
    preferred_family: null
    fallback:
      - Helvetica Neue
      - Arial
      - sans-serif
    weight: 500
    size: 18
    line_height: 1.35
    tracking: 0.01
    max_line_length: 72
    behavior:
      - muted
      - source-friendly
  metric:
    family_class: swiss-grotesk
    preferred_family: null
    fallback:
      - Helvetica Neue
      - Arial
      - sans-serif
    weight: 700
    size: 82
    line_height: 0.95
    tracking: -0.035
    max_line_length: 12
    behavior:
      - tabular-when-available
      - evidence-first
font_identification:
  exact_match: null
  class: swiss-grotesk
  characteristics:
    - neutral
    - high-x-height
    - compact
  recommended_substitutes:
    - Helvetica Neue
    - Arial
motifs:
  rules:
    usage: structural
    weight: 1
    color: rule
  numbers:
    role: navigation-and-evidence
    treatment: oversized
  cards:
    frequency: low
    radius: 0
    border: subtle
  icons:
    style: outline
    stroke: 1.5
components:
  metric:
    variants:
      - hero-number
      - compact-stat
      - delta-stat
    rules:
      - Use direct labels and a comparison period.
      - Reserve accent color for the signal requiring attention.
  quote:
    variants:
      - editorial-pullquote
    rules:
      - Keep quotes short enough to preserve typographic scale.
      - Always identify the speaker or source.
  chart:
    variants:
      - direct-label-line
      - indexed-series
      - variance-bars
    rules:
      - Prefer direct labels to legends.
      - Use minimal gridlines and annotate the decision-relevant signal.
data_visualization:
  label_strategy: Direct-label the decision-relevant series and annotate the change.
  legend_strategy: Avoid legends when direct labels fit; otherwise place a compact legend next to the chart.
  axis_strategy: Show only axes and gridlines required to interpret magnitude or time.
  uncertainty: Use ranges, confidence labels, or scenarios instead of false precision.
motion:
  level: restrained
  duration_ms: 260
  stagger_ms: 45
  entry: Fade and translate no more than 20 pixels; motion follows narrative order.
  reduced_motion: Remove transforms and show the final state immediately.
accessibility:
  min_body_size: 24
  min_caption_size: 16
  color_not_only: true
  contrast_target: AA
  reading_order: Follow assertion, evidence, interpretation, then source in DOM order.
runtime:
  canvas: {width: 1920, height: 1080}
  scaling: uniform-fixed-stage
  output: self-contained-html
  offline_safe: true
