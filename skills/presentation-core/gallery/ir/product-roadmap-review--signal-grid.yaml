schema_version: "0.1"
deck:
  id: preview-nova-flow-roadmap
  title: NOVA Flow Product Roadmap Review
  language: zh-CN
  aspect_ratio: "16:9"
  canvas: {width: 1920, height: 1080}
  scenario: {id: product-roadmap-review, version: "0.3.0"}
  design_system: {id: allen-signal-grid, version: "0.1"}
  density: medium-high
  mode: presenting-first
  metadata:
    author: Allen Skill Hub
    confidential: false
    created_at: null
    updated_at: null
    source_note: Synthetic NOVA Flow concept project; all people, scenes, evidence, and values are illustrative.
slides:
  - id: s01
    archetype: cover
    purpose: Frame the activation decision through a coherent product context.
    grammar: image-led
    assertion: {text: 下一季度，NOVA Flow 优先解决激活, status: provisional}
    narrative_role: {section: decision-frame, sequence: opening}
    layout_variant: cover-offset
    permission_profile: content-style
    objects:
      - &title
        id: s01-title
        type: text
        role: deck-title
        content: {text: "下一季度，\nNOVA Flow\n优先解决激活"}
        frame: {x: 1260, y: 176, w: 540, h: 450}
        style: {token: typography.hero, variant: null, overrides: {font_size: 76, line_height: 1.08}}
        editable: &edit {content: true, image_replace: true, data: true, style: limited, position: false, resize: false, delete: false, unlock_required: true}
      - id: s01-context
        type: text
        role: decision-context
        content: {text: NOVA Flow · 产品路线图评审 / Q4}
        frame: {x: 1260, y: 704, w: 520, h: 72}
        style: {token: typography.body, variant: null}
        editable: *edit
      - id: s01-brief
        type: text
        role: decision-brief
        content: {text: 目标不是增加功能，而是让新用户在首次会话中完成一个可感知的工作流。}
        frame: {x: 1260, y: 790, w: 500, h: 104}
        style: {token: typography.body, variant: null}
        editable: *edit
      - id: s01-disclosure
        type: text
        role: concept-disclosure
        content: {text: SYNTHETIC CONCEPT PROJECT · 概念项目，场景与数据仅用于主题演示}
        frame: {x: 1260, y: 944, w: 520, h: 44}
        style: {token: typography.caption, variant: null, overrides: {font_size: 11, line_height: 1.3}}
        editable: *edit
      - id: s01-photo
        type: image
        role: nova-cover-photo
        content:
          src: ../assets/nova-flow/nova-cover-team-v2.webp
          alt: NOVA Flow 三人产品团队在工作室中共同梳理首次工作流证据
          fit: cover
          position: center 52%
        frame: {x: 64, y: 96, w: 1110, h: 920}
        style: {token: image.documentary, variant: nova-portrait}
        constraints: {min_w: 640, min_h: 800, snap_to_grid: true, preserve_aspect_ratio: false}
        editable: *edit
      - id: s01-photo-caption
        type: text
        role: image-caption
        content: {text: 01 / DISCOVERY  ·  用户首次任务研究}
        frame: {x: 104, y: 932, w: 560, h: 34}
        style: {token: typography.caption, variant: photo-overlay}
        editable: *edit

  - id: s02
    archetype: data
    purpose: Show where activation breaks before value becomes visible.
    grammar: evidence
    assertion: {text: 激活下降，发生在用户看见价值之前, status: provisional}
    narrative_role: {section: outcome-evidence, sequence: evidence}
    layout_variant: kpi-scorecard
    permission_profile: content-style
    evidence:
      - {id: ev-nova-preview, claim: Illustrative NOVA Flow activation evidence, source_type: placeholder, source: Synthetic concept-project preview}
    objects:
      - id: s02-title
        type: text
        role: slide-assertion
        content: {text: 激活下降，发生在用户看见价值之前}
        frame: {x: 104, y: 198, w: 590, h: 330}
        style: {token: typography.slide_title, variant: null}
        editable: *edit
      - id: s02-interpretation
        type: text
        role: evidence-interpretation
        content: {text: 首次工作流平均需要 6 分钟；多数退出发生在设置完成前。下一季度应先缩短价值出现时间。}
        frame: {x: 104, y: 570, w: 560, h: 150}
        style: {token: typography.body, variant: null}
        editable: *edit
      - id: s02-exit
        type: metric
        role: primary-metric
        content: {label: 测试中提前退出, value: "5/7", period: 任务测试, delta: 方向一致}
        frame: {x: 824, y: 64, w: 490, h: 444}
        style: {token: components.metric.hero-number, variant: hero-number}
        editable: *edit
      - id: s02-time
        type: metric
        role: supporting-metric
        content: {label: 首次价值时间, value: "6m12s", period: 中位数, delta: 目标 < 3m}
        frame: {x: 1340, y: 64, w: 516, h: 444}
        style: {token: components.metric.compact-stat, variant: compact-stat}
        editable: *edit
      - id: s02-activation
        type: metric
        role: risk-metric
        content: {label: 激活率, value: "41%", period: 本季度, delta: "−8pp"}
        frame: {x: 824, y: 534, w: 1032, h: 482}
        style: {token: components.metric.delta-stat, variant: delta-stat}
        editable: *edit

  - id: s03
    archetype: closing
    purpose: Ask for a resource-allocation decision and name the next evidence.
    grammar: decision
    assertion: {text: 将 60% 产品能力投入首次工作流，并冻结两个低证据项目, status: provisional}
    narrative_role: {section: explicit-decision, sequence: closing}
    layout_variant: closing-decision
    permission_profile: content-style
    objects:
      - id: s03-label
        type: text
        role: decision-title
        content: {text: DECISION / 01}
        frame: {x: 104, y: 112, w: 520, h: 40}
        style: {token: typography.caption, variant: null}
        editable: *edit
      - id: s03-decision
        type: text
        role: decision-statement
        content: {text: "将 60% 产品能力\n投入首次工作流，\n冻结两个低证据项目"}
        frame: {x: 104, y: 180, w: 1080, h: 340}
        style: {token: typography.hero, variant: null, overrides: {font_size: 70}}
        editable: *edit
      - id: s03-owner
        type: text
        role: decision-owner
        content: {text: Owner · VP Product  /  Review · 6 weeks}
        frame: {x: 104, y: 570, w: 860, h: 62}
        style: {token: typography.body, variant: null}
        editable: *edit
      - id: s03-next
        type: text
        role: next-evidence
        content: {text: 下一证据 · 12 场任务测试 + 激活 cohort 回升至 50%}
        frame: {x: 104, y: 668, w: 850, h: 74}
        style: {token: typography.body, variant: null}
        editable: *edit
      - id: s03-photo-session
        type: image
        role: nova-usability-photo
        content:
          src: ../assets/nova-flow/nova-usability-session-v2.webp
          alt: NOVA Flow 研究员在侧面记录参与者完成首次任务时的停顿
          fit: cover
          position: center 44%
        frame: {x: 104, y: 772, w: 840, h: 244}
        style: {token: image.documentary, variant: nova-landscape}
        constraints: {min_w: 620, min_h: 420, snap_to_grid: true, preserve_aspect_ratio: false}
        editable: *edit
      - id: s03-caption-session
        type: text
        role: evidence-photo-caption
        content: {text: 观察证据 · 用户需要明确的“下一步”}
        frame: {x: 136, y: 946, w: 760, h: 34}
        style: {token: typography.caption, variant: photo-overlay}
        editable: *edit
      - id: s03-photo-detail
        type: image
        role: nova-workflow-photo
        content:
          src: ../assets/nova-flow/nova-workflow-detail-v2.webp
          alt: NOVA Flow 团队用纸质线框物证重新排列步骤并标记完成信号
          fit: cover
          position: center 54%
        frame: {x: 968, y: 772, w: 888, h: 244}
        style: {token: image.documentary, variant: nova-detail}
        constraints: {min_w: 620, min_h: 340, snap_to_grid: true, preserve_aspect_ratio: false}
        editable: *edit
      - id: s03-caption-detail
        type: text
        role: evidence-photo-caption
        content: {text: 工作流证据 · 完成信号必须提前出现}
        frame: {x: 1000, y: 946, w: 808, h: 34}
        style: {token: typography.caption, variant: photo-overlay}
        editable: *edit
