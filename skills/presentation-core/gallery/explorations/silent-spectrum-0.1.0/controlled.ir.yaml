      - {id: ss03-title, type: text, role: decision-statement, content: {text: "让页面呼吸，\n让证据靠近判断。"}, frame: {x: 110, y: 230, w: 1460, h: 300}, style: {token: typography.hero, variant: null, overrides: {font_size: 90}}, editable: *edit}
      - {id: ss03-arc, type: group, role: cadence-timeline, content: {stages: [安静页, 工作页, 证据峰值, 决策页]}, frame: {x: 110, y: 700, w: 1580, h: 160}, style: {token: components.process.linear-process, variant: linear-process}, editable: *edit}
      - {id: ss03-disclosure, type: text, role: concept-disclosure, content: {text: "CONCEPT SYSTEM / 概念系统，等待用户选择或混合方向后再形成正式模板。"}, frame: {x: 110, y: 970, w: 1080, h: 36}, style: {token: typography.caption, variant: null, overrides: {font_size: 14}}, editable: *edit}
