concept_gate:
  concept: 静谱把演示中不断变化的信息密度转译为尺度、灰阶、留白和语义谱线，让证据与决策在安静秩序中显形。
  content_origin: 来自用户九张参考图中的编辑留白、强弱尺度、高级灰、时间线与轻量线描要求，以及五个场景各自的叙事语法。
  replaceability_result: 移除主题名称后，仍可从谱域式尺度节奏、索引式严格对齐、场景化标题字体、五类语义线描和安静页—工作页—证据峰值—决策停顿的跨页节奏识别系统。
  score: 9.3
  passed: true
hard_gates:
  bounds: {passed: true, evidence: 三条方向及五套完整模板共 48 张 1920×1080 页面已通过自动边界与内容溢出检查。}
  readability: {passed: true, evidence: 五张完整接触表与代表性单页已检查；标题、正文、表格、注释和数据层级均保持可读。}
  truth: {passed: true, evidence: 当前内容明确标注为合成概念预览，示意数字不得作为真实项目成果使用。}
  image_integrity: {passed: true, evidence: 本轮采用排版、数据和语义矢量表达，没有引入无来源图片或 AI 图片瑕疵。}
  accessibility: {passed: true, evidence: 所有页面通过 4.5 比 1 的表面感知文字对比度检查，浅色底未使用白字。}
  provenance: {passed: true, evidence: 参考图仅作为设计证据分析，没有复制或重新分发品牌、原图、标识与专有组件。}
  visual_inspection: {passed: true, evidence: 三方向对照板、五套完整接触表、五场景总览及高密度关键单页均已完成人工视觉检查。}
