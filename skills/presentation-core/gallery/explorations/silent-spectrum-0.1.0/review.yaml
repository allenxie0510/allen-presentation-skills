    finding: 封面峰值、工作证据与决策停顿形成更明显节奏；标题行距放松，大号英文和数字只出现在叙事峰值。
  craft_system:
    score: 9.1
    weight: 20
    finding: 栅格、基线、灰阶、线描和对齐稳定；思源黑体、思源宋体与 Smiley Sans 已作为开放字体打包并嵌入网页输出。
  communication_evidence:
    score: 9.3
    weight: 20
    finding: 汇聚路径、范围弧线、信号脉冲、系统关系和练习闭环分别承担场景语义，不再只是同一组件换文字。
  authorship_originality:
    score: 9.0
    weight: 15
    finding: 谱域脉冲与静默索引的混合形成了可识别的母系统，五个场景也具备不同字体、尺度峰值与线描语汇。
weighted_score: 91.9
verdict: approval-candidate
keep:
  - 保留黑色主文字、深灰次级文字和绝不在浅底使用白字的硬规则。
  - 保留静默索引的严格对齐与谱域脉冲的强弱尺度节奏。
  - 保留各场景用证据任务决定组件，而不是以通用卡片填充页面的原则。
fix:
  - severity: optimization
    issue: 当前正式发布范围是自包含网页，尚未验证原生可编辑 PPTX 投影的一致性。
    action: 只有用户明确请求 PPTX 且存在兼容渲染器时，建立字体映射、可编辑对象和逐页回归测试。
    verification: 对原生 PPTX 逐页渲染并对照网页基线，检查换行、字宽、行距、图表与编辑性。
quick_wins:
  - 保持谱域脉冲为主、静默索引负责对齐与基线纪律。
  - 使用真实项目时先替换概念证据、数字、来源与结果，并保留披露边界。
  - 需要 PPTX 时单独调用兼容的原生渲染器，不把网页输出误称为原生 PPTX。
