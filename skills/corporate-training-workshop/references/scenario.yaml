schema_version: "0.2"
scenario:
  id: corporate-training-workshop
  name: Corporate Training Workshop
  version: "0.5.1"
communication_job:
  primary: Enable adult learners to perform a defined workplace behavior through relevant explanation, practice, feedback, and transfer support.
  success_condition: Learners can demonstrate the target capability, plan workplace application, and generate evidence for learning and transfer evaluation.
audience:
  - adult-learners
  - managers
  - facilitators
  - learning-sponsors
decision_types:
  - practice
  - apply
  - commit
  - improve
  - transfer
storyline_patterns:
  - relevance-model-practice-feedback-application
  - problem-example-rule-practice-reflection
  - experience-concept-experiment-commitment
evidence_standard:
  level: high
  claim_policy: Distinguish training need, learning objective, participation, learner performance, transfer behavior, and business result; do not infer one level from another.
  source_policy: Preserve needs-analysis method, learner context, content authority, assessment criteria, timing, sample, and evaluation limitations.
density:
  default: medium
  range:
    - low
    - medium
preferred_grammar:
  - assertion
  - evidence
  - comparison
  - process
  - hierarchy
  - narrative
  - decision
required_archetypes:
  - relevance-opening
  - learning-outcomes
  - workshop-agenda
  - mental-model
  - worked-example
  - activity-brief
  - debrief
  - knowledge-check
  - action-plan
  - transfer-commitment
  - evaluation
theme_recommendations:
  default: learning-agent
  alternatives: [learning-canvas, artifact-editorial]
  selection_note: Use the approved Learning Agent theme for human, practice-led capability building; Learning Canvas for simpler facilitation systems; and Artifact Editorial for reflective or creative workshops.
component_recipes:
  relevance-opening: {archetype: cover, layout_variant: cover-indexed, purpose: Connect the workshop to a real performance need, required_roles: [deck-title, performance-need, relevance]}
  learning-outcomes: {archetype: statement, layout_variant: statement-bracketed, purpose: State observable learner performance, required_roles: [observable-outcomes, success-evidence]}
  workshop-agenda: {archetype: timeline, layout_variant: phased-roadmap, purpose: Show the learning arc and protected practice time, required_roles: [agenda-phases, timing, practice-time]}
  mental-model: {archetype: process, layout_variant: linear-process, purpose: Explain the smallest useful model, required_roles: [model-stages, decision-points]}
  worked-example: {archetype: two-column, layout_variant: two-column-emphasis, purpose: Demonstrate the model on a realistic case, required_roles: [example-input, worked-steps, example-output]}
  activity-brief: {archetype: process, layout_variant: learning-loop, purpose: "Give objective, steps, timebox, output, and fallback", required_roles: [activity-objective, instructions, timer, expected-output]}
  debrief: {archetype: quote, layout_variant: reflection-quote, purpose: Convert practice experience into transferable insight, required_roles: [debrief-question, learner-evidence, principle]}
  knowledge-check: {archetype: comparison, layout_variant: tradeoff-matrix, purpose: Assess a decision or application, required_roles: [check-prompt, options, feedback-rule]}
  action-plan: {archetype: timeline, layout_variant: milestone-evidence, purpose: Plan application with evidence and timing, required_roles: [next-action, workplace-context, success-evidence]}
  transfer-commitment: {archetype: closing, layout_variant: closing-commitment, purpose: Make workplace transfer specific and owned, required_roles: [commitment, owner, review-date]}
  evaluation: {archetype: data, layout_variant: evidence-ledger, purpose: "Distinguish reaction, learning, behavior, and results evidence", required_roles: [evaluation-levels, measures, limitations]}
anti_patterns:
  - lecture-only
  - content-dump
  - vague-objective
  - activity-without-debrief
  - satisfaction-only-evaluation
  - training-for-nontraining-gap
default_permission_profile: content-style
